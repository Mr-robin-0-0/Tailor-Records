name: tailor_records
description: Local-first customer measurement records for tailors.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  path_provider: ^2.1.1
  intl: ^0.19.0
  package_info_plus: ^8.3.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  isar_generator: 3.1.0+1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
